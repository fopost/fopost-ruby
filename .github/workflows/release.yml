name: Release

# Tag the commit as v<version> matching lib/fopost/version.rb, e.g. v0.1.0.
# Publishing uses RubyGems trusted publishing — configure the publisher for
# fopost/fopost-ruby on rubygems.org before the first tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Gates publishing behind a dedicated environment, so commit access alone
    # does not grant the ability to push a release to RubyGems.
    environment:
      name: rubygems
      url: https://rubygems.org/gems/fopost
    permissions:
      contents: read
      id-token: write # RubyGems trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Verify tag matches the gem version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(ruby -Ilib -e 'require "fopost/version"; print Fopost::VERSION')
          [ "$VERSION" = "$TAG" ] || { echo "::error::version.rb is $VERSION but tag is $TAG"; exit 1; }

      - run: bundle exec rubocop
      - run: bundle exec rake test

      - run: gem build fopost.gemspec

      # Catches the class of bug where the gem builds but is unusable once
      # installed on its own.
      - name: Smoke test the built gem
        run: |
          gem install ./fopost-*.gem
          ruby -e "
          require 'fopost'
          client = Fopost.new(api_key: 'x')
          %i[posts accounts workspaces labels ai].each { |ns| raise ns.to_s unless client.public_send(ns) }
          puts 'require ok'
          "

      - uses: rubygems/release-gem@v1
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
